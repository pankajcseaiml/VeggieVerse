<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Bites 🌿 Chatbot</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>Green Bites 🌿</h1>
                <p>Vegetarian Paradise</p>
            </div>
            <div class="status-indicator"></div>
        </header>

        <div class="chat-window" id="chat-window">
            <!-- Messages will appear here -->
        </div>

        <div class="quick-replies">
            <button class="chip" onclick="sendQuickReply('View Menu')">View Menu</button>
            <button class="chip" onclick="sendQuickReply('Make Reservation')">Make Reservation</button>
            <button class="chip" onclick="sendQuickReply('Today\'s Special')">Today's Special</button>
            <button class="chip" onclick="sendQuickReply('Contact Us')">Contact Us</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
